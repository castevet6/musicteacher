<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music Teacher</title>
  <meta name="description" content="Learn scales and chords on guitar and piano.">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <header class="topbar">
    <h1>Music Teacher</h1>
    <div id="controls" class="controls"></div>
  </header>

  <main class="layout">
    <section class="instrument" aria-label="Instrument">
      <div id="guitar"></div>
      <div id="piano" hidden></div>
      <ul class="legend" aria-label="Legend">
        <li><span class="swatch swatch-root"></span>Root</li>
        <li><span class="swatch swatch-scale"></span>Scale note</li>
        <li><span class="swatch swatch-blue"></span>Blue note</li>
        <li><span class="swatch swatch-out"></span>Out of scale</li>
        <li><span class="swatch swatch-chord"></span>Chord tone (R 3 5 7)</li>
      </ul>
    </section>

    <aside id="chords" class="panel" aria-live="polite"></aside>
  </main>
</body>
</html>
